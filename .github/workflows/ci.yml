name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/notesapp/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/notesapp/app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/notesapp/app
    strategy:
      fail-fast: false
      matrix:
        base: ["/", "/mattpococktesting/"]
    env:
      NOTES_BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/notesapp/app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright builds and serves the app itself (see playwright.config.ts).
      - run: npm run test:e2e
